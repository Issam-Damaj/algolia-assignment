<!DOCTYPE html>
<html class="no-js" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <title>Restaurant Locator - by Algolia</title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
	<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <link rel="icon" href="/algolia-assignment/assets/favicon-oGjiQh0p.ico" type="image/png" />
    <script type="module" crossorigin src="/algolia-assignment/assets/index-B8CqGl8g.js"></script>
    <link rel="stylesheet" crossorigin href="/algolia-assignment/assets/index-DaPu4fsM.css">
  </head>

 <body>
    <div class="page">
      <div class="page__container">
        
        <header class="search-bar">
    <div class="search-bar__container">
  <div class="search-input-wrapper">
    <input
      type="search"
      class="search-bar__input"
      id="search-input"
      placeholder="Search for Restaurants by Name, Cuisine, Location"
      autocomplete="off"
    />

    <button id="clear-search" class="clear-search"></button>
  </div>
</div>

        </header>
        <div class="page__content">
		<button class="mobile-filter-toggle">Filters ☰</button>
          <aside class="filter">
            <div class="filter__section">
              <span class="filter__title">Cuisine/Food Type</span>
              <div id="cuisine-facet"></div>
            </div>
            
            <div class="filter__section">
              <span class="filter__title">Rating</span>
              <div id="rating-facet"></div>
            </div>

            <div class="filter__section">
              <span class="filter__title">Payment Options</span>
              <div id="payment-facet"></div>
            </div>
          </aside>

          <main class="results">
            <div class="results__stats-bar">
              <span class="results__count-text" id="stats"></span>
            </div>

            <div id="hits"></div>

            <div class="button">
              <button class="button__link" id="show-more">Show More</button>
            </div>

          </main>
        </div>
      </div>
    </div>
    <script type="text/html" id="result-template">
      <div class="results__item">
        <div class="result">
          <div class="result__image-container">
            <img src="{{image_url}}" class="result__image" alt="{{name}}" onerror="this.style.display='none'" />
          </div>
          <div class="result__text-container">
            <h1 class="result__title">{{name}}</h1>
			<div class="result__rating">
			{{stars_count}} {{stars_html}} 
			<span class="result__summary">({{reviews_count}} reviews)</span>
        </div>            
<p class="result__summary">{{food_type}} | {{neighborhood}} | {{price_range}}</p>
          </div>
        </div>
      </div>
    </script>
    <!-- /INTERFACE -->

    <script type="text/html" id="no-results-template">
      <div id="no-results-message">
      	<p>We didn't find any results for the search <em>"{{query}}"</em>.</p>
      	<a href="." class='clear-all'>Clear search</a>
      </div>
    </script>

    <!-- /TEMPLATES -->

    <!-- SCRIPTS -->
    <!-- /SCRIPTS -->
  </body>
</html>
